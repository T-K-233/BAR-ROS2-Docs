<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480"
     width="940" height="480" font-family="ui-monospace, Menlo, Consolas, Courier, monospace"
     font-size="13" fill="#111111" text-rendering="geometricPrecision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white"/>
<text x="20" y="28" font-size="15" font-weight="700" text-anchor="start" fill="#111111" dominant-baseline="middle">Five control modes</text>
<text x="20" y="46" font-size="11" font-weight="400" text-anchor="start" fill="#888888" dominant-baseline="middle">Each button → switch_controller directly; any transition from any state (BEST_EFFORT).</text><rect x="45" y="210" width="185" height="66" rx="6" ry="6" fill="#ffece2" stroke="#ff6633" stroke-width="1.5"/>
<text x="137" y="234" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">joy_teleop</text>
<text x="137" y="251" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">/joy → switch_controller</text>
<rect x="560" y="64" width="250" height="52" rx="6" ry="6" fill="#E7FFE7" stroke="#3B7A57" stroke-width="1.5"/>
<text x="685" y="82" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">zero_torque_controller</text>
<text x="685" y="100" font-size="11" font-weight="400" text-anchor="middle" fill="#888888" dominant-baseline="middle">BACK = STOP</text><rect x="560" y="142" width="250" height="52" rx="6" ry="6" fill="#E7FFE7" stroke="#3B7A57" stroke-width="1.5"/>
<text x="685" y="168" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">damping_controller</text>
<rect x="560" y="220" width="250" height="52" rx="6" ry="6" fill="#ffece2" stroke="#ff6633" stroke-width="1.5"/>
<text x="685" y="246" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">standby_controller_a / b / y</text>
<rect x="560" y="298" width="250" height="52" rx="6" ry="6" fill="#eef0f2" stroke="#5f6671" stroke-width="1.5"/>
<text x="685" y="316" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">rl_policy_controller</text>
<text x="685" y="334" font-size="11" font-weight="400" text-anchor="middle" fill="#888888" dominant-baseline="middle">LOCOMOTION</text><rect x="560" y="376" width="250" height="52" rx="6" ry="6" fill="#eef0f2" stroke="#5f6671" stroke-width="1.5"/>
<text x="685" y="394" font-size="13" font-weight="600" text-anchor="middle" fill="#111111" dominant-baseline="middle">remote_policy_controller</text>
<text x="685" y="412" font-size="11" font-weight="400" text-anchor="middle" fill="#888888" dominant-baseline="middle">REMOTE</text><line x1="230" y1="243" x2="556" y2="90" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="397" y="149" width="36" height="18" rx="4" ry="4" fill="white" stroke="#888888" stroke-width="0.8"/>
<text x="415" y="158" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" dominant-baseline="middle">BACK</text><line x1="230" y1="243" x2="556" y2="168" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="405" y="188" width="20" height="18" rx="4" ry="4" fill="white" stroke="#888888" stroke-width="0.8"/>
<text x="415" y="197" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" dominant-baseline="middle">X</text><line x1="230" y1="243" x2="556" y2="246" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="367" y="227" width="96" height="18" rx="4" ry="4" fill="white" stroke="#888888" stroke-width="0.8"/>
<text x="415" y="236" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" dominant-baseline="middle">L1 + A / B / Y</text><line x1="230" y1="243" x2="556" y2="324" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="391" y="266" width="48" height="18" rx="4" ry="4" fill="white" stroke="#888888" stroke-width="0.8"/>
<text x="415" y="275" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" dominant-baseline="middle">R1 + A</text><line x1="230" y1="243" x2="556" y2="402" stroke="#111111" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="391" y="305" width="48" height="18" rx="4" ry="4" fill="white" stroke="#888888" stroke-width="0.8"/>
<text x="415" y="314" font-size="11" font-weight="400" text-anchor="middle" fill="#111111" dominant-baseline="middle">R1 + B</text><text x="46" y="372" font-size="11" font-weight="400" text-anchor="start" fill="#888888" dominant-baseline="middle">Fault path (native, not a joy button):</text><text x="46" y="387" font-size="11" font-weight="400" text-anchor="start" fill="#888888" dominant-baseline="middle">a controller update() → ERROR is dropped</text><text x="46" y="402" font-size="11" font-weight="400" text-anchor="start" fill="#888888" dominant-baseline="middle">to damping via fallback_controllers.</text><text x="46" y="417" font-size="11" font-weight="400" text-anchor="start" fill="#888888" dominant-baseline="middle">/safety_status is telemetry (no auto-DAMP).</text><text x="810" y="444" font-size="11" font-weight="400" text-anchor="end" fill="#3B7A57" dominant-baseline="middle">safe / fail-safe</text><text x="810" y="459" font-size="11" font-weight="400" text-anchor="end" fill="#cc4a1f" dominant-baseline="middle">standby (interpolate to pose)</text><text x="810" y="474" font-size="11" font-weight="400" text-anchor="end" fill="#5f6671" dominant-baseline="middle">active policy</text></svg>
